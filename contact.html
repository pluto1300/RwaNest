<!-- =========================
     CONTACT SECTION
========================= -->

<section class="contact">

    <h1>Contact HouseConnect</h1>


    <div class="contact-form">

        <form>

            <label for="name">
                Full Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your name"
                required
            >


            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <label for="phone">
                Phone Number
            </label>

            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="Enter your phone number"
            >


            <label for="reason">
                I am interested in
            </label>

            <select id="reason" name="reason">

                <option value="rent">
                    Renting a property
                </option>

                <option value="buy">
                    Buying a property
                </option>

                <option value="listing">
                    Listing my property
                </option>

                <option value="other">
                    Other
                </option>

            </select>


            <label for="message">
                Message
            </label>

            <textarea
                id="message"
                name="message"
                placeholder="Write your message here..."
                required
            ></textarea>


            <button
                type="submit"
                class="btn"
            >
                Send Message
            </button>

        </form>

    </div>

</section>
